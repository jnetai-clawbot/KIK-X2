name: Build and Release KIK-X2 APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install apktool
        run: |
          APKTOOL_VERSION="2.12.0"
          wget -q "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" -O /usr/local/bin/apktool.jar
          echo '#!/bin/bash' > /usr/local/bin/apktool
          echo 'exec java -jar /usr/local/bin/apktool.jar "$@"' >> /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool

      - name: Install Android SDK tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt2 2>/dev/null || true
          if ! command -v aapt2 &> /dev/null; then
            BUILD_TOOLS="36.0.0"
            wget -q "https://dl.google.com/android/repository/build-tools_r${BUILD_TOOLS}-linux.zip" -O /tmp/bt.zip
            unzip -qo /tmp/bt.zip -d /tmp/android-sdk/
            mkdir -p /usr/local/lib/android-sdk/build-tools
            mv /tmp/android-sdk/android-* /usr/local/lib/android-sdk/build-tools/
            ln -sf /usr/local/lib/android-sdk/build-tools/android-*/aapt2 /usr/local/bin/aapt2
            ln -sf /usr/local/lib/android-sdk/build-tools/android-*/apksigner /usr/local/bin/apksigner
            ln -sf /usr/local/lib/android-sdk/build-tools/android-*/zipalign /usr/local/bin/zipalign
          fi
          if ! command -v apksigner &> /dev/null; then
            ln -sf /usr/local/lib/android-sdk/build-tools/android-*/apksigner /usr/local/bin/apksigner
            ln -sf /usr/local/lib/android-sdk/build-tools/android-*/zipalign /usr/local/bin/zipalign
          fi

      - name: Build APK with apktool
        run: |
          apktool b source -o KIK-X2-unsigned.apk

      - name: Zipalign APK
        run: |
          if command -v zipalign &> /dev/null; then
            zipalign -v 4 KIK-X2-unsigned.apk KIK-X2-aligned.apk
          else
            cp KIK-X2-unsigned.apk KIK-X2-aligned.apk
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          apksigner sign \
            --ks release.keystore \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias ciphervault \
            --key-pass pass:"$KEYSTORE_PASSWORD" \
            --out KIK-X2.apk \
            KIK-X2-aligned.apk

      - name: Verify APK signature
        run: |
          apksigner verify --verbose KIK-X2.apk

      - name: Get version from apktool.yml
        id: version
        run: |
          VERSION=$(grep versionName source/apktool.yml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: KIK-X2 v${{ steps.version.outputs.version }}
          files: KIK-X2.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
