name: Build and Release KIK-X2 APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0'

      - name: Install apktool
        run: |
          APKTOOL_VERSION="2.12.0"
          curl -sL "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" -o /usr/local/bin/apktool.jar
          echo '#!/bin/bash' > /usr/local/bin/apktool
          echo 'exec java -jar /usr/local/bin/apktool.jar "$@"' >> /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool

      - name: Build APK with apktool
        run: |
          apktool b source -o KIK-X2-unsigned.apk

      - name: Zipalign APK
        run: |
          ZIPALIGN=$(find $ANDROID_HOME -name zipalign -type f 2>/dev/null | head -1)
          if [ -n "$ZIPALIGN" ]; then
            $ZIPALIGN -v 4 KIK-X2-unsigned.apk KIK-X2-aligned.apk
          else
            cp KIK-X2-unsigned.apk KIK-X2-aligned.apk
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          APKSIGNER=$(find $ANDROID_HOME -name apksigner -type f 2>/dev/null | head -1)
          $APKSIGNER sign \
            --ks release.keystore \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias ciphervault \
            --key-pass pass:"$KEYSTORE_PASSWORD" \
            --out KIK-X2.apk \
            KIK-X2-aligned.apk

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find $ANDROID_HOME -name apksigner -type f 2>/dev/null | head -1)
          $APKSIGNER verify --verbose KIK-X2.apk

      - name: Get version from apktool.yml
        id: version
        run: |
          VERSION=$(grep versionName source/apktool.yml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: KIK-X2 v${{ steps.version.outputs.version }}
          files: KIK-X2.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
